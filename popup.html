<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multi Word Highlighter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h2>Multi Word Highlighter</h2>
    <p class="hint">Enter one word or phrase per line.</p>

    <textarea id="words" placeholder="SEO
backlink
keyword research
study in UK"></textarea>

    <div class="buttons">
      <button id="highlight" class="primary">Highlight</button>
      <button id="clear">Clear</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
